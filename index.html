<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CUBE</title>
<style>
:root{--bg:#050506;--fg:#f5f5f7;--dim:#86868b;--faint:#4a4a4f;color-scheme:dark;box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--fg);overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;user-select:none;-webkit-user-select:none}
canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
.fx{position:fixed;left:0;right:0;text-align:center;pointer-events:none}
#hud{top:calc(env(safe-area-inset-top,0px) + 4vh);opacity:0;transition:opacity .7s ease}
#score{font-size:clamp(44px,8vh,84px);font-weight:200;letter-spacing:.02em;font-variant-numeric:tabular-nums;line-height:1}
#best{margin-top:10px;font-size:11px;letter-spacing:.32em;padding-left:.32em;color:var(--dim);font-weight:500}
#ov{top:50%;opacity:0;transform:translateY(-50%) scale(.94);filter:blur(12px);transition:opacity .6s cubic-bezier(.2,.8,.2,1),transform .6s cubic-bezier(.2,.8,.2,1),filter .6s cubic-bezier(.2,.8,.2,1)}
#ov.on{opacity:1;transform:translateY(-50%) scale(1);filter:blur(0)}
#big{margin:0;padding-left:.18em;font-size:clamp(56px,13vh,132px);font-weight:200;letter-spacing:.18em;line-height:1}
#sub{margin:18px 0 0;padding-left:.4em;font-size:13px;letter-spacing:.4em;color:var(--dim);font-weight:500;min-height:1em}
#cta{margin:44px 0 0;padding-left:.32em;font-size:12px;letter-spacing:.32em;font-weight:600;animation:br 2.4s ease-in-out infinite}
#hint{margin:16px 0 0;font-size:10px;letter-spacing:.24em;color:var(--faint)}
#mute{position:fixed;right:calc(env(safe-area-inset-right,0px) + 14px);bottom:calc(env(safe-area-inset-bottom,0px) + 10px);background:none;border:0;color:#fff;opacity:.22;font:inherit;font-size:10px;font-weight:500;letter-spacing:.24em;cursor:pointer;padding:8px;transition:opacity .3s}
#mute:hover,#mute:focus-visible{opacity:.75;outline:none}
#tp{bottom:calc(env(safe-area-inset-bottom,0px) + 2vh);opacity:0;transition:opacity .7s ease}
#tpv{font-size:11px;letter-spacing:.32em;padding-left:.32em;color:var(--dim);font-weight:500;font-variant-numeric:tabular-nums}
#tpb{display:block;width:180px;height:3px;margin:10px auto 0;border-radius:2px;background:rgba(255,255,255,.1);overflow:hidden}
#tpf{display:block;height:100%;width:0;background:#fff;border-radius:2px;transition:width .12s linear}
#ups{margin-top:12px;font-size:9px;letter-spacing:.22em;padding-left:.22em;color:var(--faint);min-height:1em;white-space:pre}
#toast{top:calc(env(safe-area-inset-top,0px) + 19vh);opacity:0;font-size:12px;letter-spacing:.34em;padding-left:.34em;font-weight:600}
@keyframes br{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){#cta{animation:none}#ov{transition-duration:.01s}}
</style>
<style>
canvas{transition:filter .9s cubic-bezier(.2,.8,.2,1)}
canvas.bl{filter:blur(9px) brightness(.8)}
.gl{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:16px;-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);box-shadow:0 8px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.06)}
small{display:block;font-size:9px;letter-spacing:.3em;color:var(--dim);font-weight:600}
#hud{top:calc(env(safe-area-inset-top,0px) + 2.6vh);padding:0 max(3vw,14px);box-sizing:border-box;display:flex;justify-content:space-between;align-items:flex-start;text-align:left;opacity:0;transition:opacity .7s ease}
#sc,#st{padding:12px 18px}
#sc{min-width:150px}
#score{font-size:clamp(34px,6vh,58px);font-weight:200;line-height:1.05;margin:6px 0 4px;letter-spacing:.02em;transform-origin:left center}
#best{margin:0;color:var(--faint)}
#st{text-align:right}
#thr{display:flex;gap:4px;justify-content:flex-end;margin:9px 0 8px}
#thr b{width:16px;height:5px;border-radius:2px;background:rgba(255,255,255,.12);transition:background .4s,box-shadow .4s}
#thr b.on{background:#fff;box-shadow:0 0 10px rgba(255,255,255,.55)}
#thr b.on:nth-child(n+4){background:#ff4a4f;box-shadow:0 0 10px rgba(255,60,66,.6)}
#tm{color:var(--fg);font-size:13px;letter-spacing:.2em;font-variant-numeric:tabular-nums}
#tpr{display:inline-flex;align-items:center;gap:16px;padding:10px 18px}
#key{font-size:10px;font-weight:700;letter-spacing:.16em;padding:6px 12px;border:1px solid rgba(255,255,255,.16);border-bottom-width:3px;border-radius:8px;color:var(--faint);transition:all .15s}
#tpb{width:min(300px,40vw);height:8px;margin:0;border-radius:2px;background:repeating-linear-gradient(90deg,rgba(255,255,255,.1) 0 8px,transparent 8px 10px)}
#tpf{-webkit-mask:repeating-linear-gradient(90deg,#000 0 8px,transparent 8px 10px);mask:repeating-linear-gradient(90deg,#000 0 8px,transparent 8px 10px);border-radius:0;transition:width .1s linear}
#tpv{min-width:50px;text-align:left}
#tp.rdy #key{color:#fff;border-color:rgba(255,255,255,.55);box-shadow:0 0 14px rgba(255,255,255,.18)}
#tp.rdy #tpb{filter:drop-shadow(0 0 6px rgba(255,255,255,.55))}
#tp.dn #key{transform:translateY(2px);border-bottom-width:1px;background:rgba(255,255,255,.14)}
#tp.full #tpv{color:#fff}
#ups{display:flex;gap:8px;justify-content:center;margin-top:10px;padding:0;min-height:0;white-space:normal}
.ch{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 10px;min-width:58px;border:1px solid rgba(255,255,255,.07);border-radius:10px;background:rgba(255,255,255,.03);opacity:.45;transition:opacity .3s,border-color .3s}
.ch.on{opacity:1;border-color:rgba(255,255,255,.22);background:rgba(255,255,255,.07)}
.ch em{font-style:normal;font-size:8px;letter-spacing:.22em;color:var(--dim);font-weight:600}
.ch b{font-size:7px;letter-spacing:.14em;color:#fff;font-weight:400;white-space:nowrap}
#toast{width:max-content;margin:0 auto;padding:10px 24px;border-radius:999px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.16);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);font-size:11px}
#big{background:linear-gradient(180deg,#fff 25%,#8e8e93);-webkit-background-clip:text;background-clip:text;color:transparent}
#cta{display:inline-block;margin:38px 0 0;padding:14px 34px 14px calc(34px + .32em);border:1px solid rgba(255,255,255,.2);border-radius:999px;background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);box-shadow:0 0 30px rgba(255,255,255,.06)}
#cube3d{display:none;position:relative;width:140px;height:140px;margin:0 auto 30px;perspective:700px}
#ov.menu #cube3d{display:block}
#cg{position:absolute;inset:-46px;background:radial-gradient(closest-side,rgba(255,255,255,.26),rgba(255,255,255,0));animation:pl 3.2s ease-in-out infinite}
#cbx{position:absolute;inset:0;margin:auto;width:84px;height:84px;transform-style:preserve-3d;animation:spin 14s linear infinite}
#cbx i{position:absolute;inset:0;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.55)}
#cbx .a{background:linear-gradient(145deg,#fff,#dcdce2);transform:translateZ(42px)}
#cbx .b{background:linear-gradient(145deg,#c9c9cf,#b0b0b8);transform:rotateY(180deg) translateZ(42px)}
#cbx .c{background:linear-gradient(145deg,#f1f1f5,#cfcfd6);transform:rotateY(90deg) translateZ(42px)}
#cbx .d{background:linear-gradient(145deg,#b9b9c0,#9e9ea6);transform:rotateY(-90deg) translateZ(42px)}
#cbx .e{background:#fff;transform:rotateX(90deg) translateZ(42px)}
#cbx .g{background:#8a8a92;transform:rotateX(-90deg) translateZ(42px)}
@keyframes spin{from{transform:rotateX(-24deg) rotateY(0)}to{transform:rotateX(-24deg) rotateY(360deg)}}
@keyframes pl{50%{opacity:.55;transform:scale(1.08)}}
@media (prefers-reduced-motion:reduce){#cbx{animation-duration:60s}#cg{animation:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="fx"><div id="sc" class="gl"><small>SCORE</small><div id="score">0</div><small id="best">BEST 0</small></div><div id="st" class="gl"><small>THREAT</small><div id="thr"><b></b><b></b><b></b><b></b><b></b></div><small id="tm">0:00</small></div></div>
<div id="ov" class="fx"><div id="cube3d"><div id="cg"></div><div id="cbx"><i class="a"></i><i class="b"></i><i class="c"></i><i class="d"></i><i class="e"></i><i class="g"></i></div></div><h1 id="big">CUBE</h1><p id="sub">DODGE</p><p id="cta">PRESS ANY KEY</p><p id="hint">WASD / ARROWS · P PAUSE · M MUTE</p></div>
<div id="tp" class="fx"><div id="tpr" class="gl"><span id="key">SPACE</span><div id="tpb"><b id="tpf"></b></div><span id="tpv">TP 0</span></div><div id="ups"></div></div>
<div id="toast" class="fx"></div>
<button id="mute" type="button" aria-label="Toggle sound">SOUND</button>
<script>
(()=>{
'use strict';
/* ================= UTIL ================= */
const $=id=>document.getElementById(id);
const TAU=Math.PI*2,rnd=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
const damp=(a,b,k,dt)=>lerp(a,b,1-Math.exp(-k*dt)); // frame-rate independent smoothing
const easeOutBack=t=>1+2.70158*Math.pow(t-1,3)+1.70158*Math.pow(t-1,2);
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:v}catch(e){return d}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const mq=matchMedia('(prefers-reduced-motion: reduce)');let reduce=mq.matches;
if(mq.addEventListener)mq.addEventListener('change',e=>{reduce=e.matches});

/* ================= GAME STATE ================= */
const AW=1000,AH=640,MAXV=430,CTRL='WASD / ARROWS · SPACE FIRE · P PAUSE · M MUTE';
const G={state:'menu',tp:0,upT:8,t:0,diff:0,speed:210,next:1,bonus:0,score:0,nmCd:0,tr:0,fl:0,fc:0,dyT:0,overT:0,nb:false};
let clock=0,ts=1,slowT=0,slowTo=1,freeze=0,best=+store.get('cube-best','0')||0,last=performance.now();
const cam={x:0,y:0,z:1,zk:0};
const shake=a=>{G.tr=Math.min(1,G.tr+a*(reduce?.2:1))};       // camera trauma
const slow=(t,to)=>{if(!reduce){slowT=t;slowTo=to}};          // brief time dilation

/* ================= CANVAS ================= */
const cv=$('c'),ctx=cv.getContext('2d');
let vw=0,vh=0,dpr=1,scale=1;
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);vw=innerWidth;vh=innerHeight;cv.width=Math.round(vw*dpr);cv.height=Math.round(vh*dpr);scale=Math.min(vw*.92/AW,vh*.74/AH)}
addEventListener('resize',resize);resize();

/* ================= UI ================= */
const ov=$('ov'),big=$('big'),sub=$('sub'),cta=$('cta'),hint=$('hint'),hud=$('hud'),scoreEl=$('score'),bestEl=$('best'),muteBtn=$('mute');
function showOv(b,s,c,h){big.textContent=b;sub.textContent=s;cta.textContent=c;hint.textContent=h;ov.classList.add('on');ov.classList.toggle('menu',b==='CUBE');cv.classList.toggle('bl',b==='CUBE')}
function hideOv(){ov.classList.remove('on');cv.classList.remove('bl')}
function hudUpdate(){scoreEl.textContent=G.score;bestEl.textContent='BEST '+Math.max(best,G.score)}

/* ================= AUDIO (Web Audio, generated) ================= */
let AC=null,master=null,muted=store.get('cube-mute','0')==='1';
function audio(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=muted?0:.5;master.connect(AC.destination)}catch(e){}}if(AC&&AC.state==='suspended')AC.resume()}
function tone(f,d,type,v,f2){if(!AC||muted)return;const t=AC.currentTime,o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(master);o.start(t);o.stop(t+d+.02)}
function noise(d,v,f){if(!AC||muted)return;const n=AC.sampleRate*d|0,b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),fl=AC.createBiquadFilter(),g=AC.createGain();s.buffer=b;fl.type='lowpass';fl.frequency.value=f;g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(master);s.start()}
const sfx={ui(){tone(520,.07,'sine',.08,720)},move(){tone(140+rnd(0,20),.05,'triangle',.03)},spawn(){tone(210,.06,'sine',.016,150)},land(){tone(110,.18,'sine',.14,45)},near(){tone(620,.16,'sine',.09,1400);tone(1240,.1,'triangle',.03)},death(){noise(.7,.5,900);tone(180,.6,'sawtooth',.12,35)}};
function setMute(m){muted=m;store.set('cube-mute',m?'1':'0');if(master)master.gain.value=m?0:.5;muteBtn.textContent=m?'MUTED':'SOUND'}
setMute(muted);

/* ================= GLOW SPRITES (cheap bloom) ================= */
function glow(rgb){const c=document.createElement('canvas');c.width=c.height=128;const g=c.getContext('2d'),r=g.createRadialGradient(64,64,0,64,64,64);r.addColorStop(0,'rgba('+rgb+',.55)');r.addColorStop(.4,'rgba('+rgb+',.16)');r.addColorStop(1,'rgba('+rgb+',0)');g.fillStyle=r;g.fillRect(0,0,128,128);return c}
const glowW=glow('255,255,255'),glowR=glow('255,32,40');

/* ================= PARTICLES (ring-buffer pool) ================= */
const PN=420,parts=Array.from({length:PN},()=>({on:0,x:0,y:0,vx:0,vy:0,l:0,m:1,s:2,r:0,vr:0,c:0,d:1}));let pi=0;
function emit(x,y,vx,vy,life,s,c,d,vr){const p=parts[pi];pi=(pi+1)%PN;p.on=1;p.x=x;p.y=y;p.vx=vx;p.vy=vy;p.l=p.m=life;p.s=s;p.c=c;p.d=d;p.r=rnd(0,TAU);p.vr=vr||0}
function burst(x,y,n,spd,life,s,c,d){for(let i=0;i<n;i++){const a=rnd(0,TAU),v=spd*rnd(.25,1);emit(x,y,Math.cos(a)*v,Math.sin(a)*v,life*rnd(.6,1),s*rnd(.5,1.2),c,d,rnd(-8,8))}}
function stepParts(dt){for(let i=0;i<PN;i++){const p=parts[i];if(!p.on)continue;p.l-=dt;if(p.l<=0){p.on=0;continue}const f=Math.exp(-p.d*dt);p.vx*=f;p.vy*=f;p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt}}

/* ================= PLAYER ================= */
const P={x:AW/2,y:AH/2,vx:0,vy:0,s:26,rot:0,qx:0,qy:0,qxv:0,qyv:0,cd:0,tt:0,drop:0,alive:true};
const keys={},MAP={KeyW:'u',ArrowUp:'u',KeyS:'d',ArrowDown:'d',KeyA:'l',ArrowLeft:'l',KeyD:'r',ArrowRight:'r',Space:'f',KeyJ:'f'};
function land(){P.qx=.24;P.qy=-.3;P.qxv=P.qyv=0;burst(P.x,P.y,18,280,.55,3,0,3.5);shake(.3);sfx.land()}
function stepPlayer(dt){
  if(!P.alive)return;
  if(P.drop>0){P.drop-=dt/.45;if(P.drop<=0){P.drop=0;land()}}
  let ax=0,ay=0;if(G.state==='play'){ax=(keys.r|0)-(keys.l|0);ay=(keys.d|0)-(keys.u|0)}else if(G.state==='menu'){demoAI(dt);ax=dax;ay=day}
  const l=Math.hypot(ax,ay);if(l>1){ax/=l;ay/=l}
  const sp0=Math.hypot(P.vx,P.vy);P.cd-=dt;
  // sharp direction change: stretch along new heading + small puff
  if(l>0&&sp0>170&&P.cd<=0&&(ax*P.vx+ay*P.vy)/(sp0*l)<.25){P.qx=.2*Math.abs(ax)-.1*Math.abs(ay);P.qy=.2*Math.abs(ay)-.1*Math.abs(ax);P.qxv=P.qyv=0;P.cd=.16;burst(P.x,P.y,6,130,.32,2.6,0,4);sfx.move()}
  // acceleration: snappy when pushing, softer when releasing
  const k=l>0?11:7;const mv=MAXV*(1+.3*(P.z>0));P.vx=damp(P.vx,ax*mv,k,dt);P.vy=damp(P.vy,ay*mv,k,dt);
  P.x+=P.vx*dt;P.y+=P.vy*dt;
  // arena bounds + wall impact squash
  const m=P.s/2+4;
  if(P.x<m||P.x>AW-m){const v=Math.abs(P.vx),sg=P.x<m?-1:1;P.x=clamp(P.x,m,AW-m);if(v>140){P.qx=-.26;P.qy=.16;P.qxv=P.qyv=0;burst(P.x+sg*P.s/2,P.y,6,150,.35,2.6,0,4);sfx.move();shake(.05)}P.vx=0}
  if(P.y<m||P.y>AH-m){const v=Math.abs(P.vy),sg=P.y<m?-1:1;P.y=clamp(P.y,m,AH-m);if(v>140){P.qy=-.26;P.qx=.16;P.qxv=P.qyv=0;burst(P.x,P.y+sg*P.s/2,6,150,.35,2.6,0,4);sfx.move();shake(.05)}P.vy=0}
  // springs return the cube to its rest shape (with wobble)
  P.qxv+=(-P.qx*300-P.qxv*17)*dt;P.qx+=P.qxv*dt;P.qyv+=(-P.qy*300-P.qyv*17)*dt;P.qy+=P.qyv*dt;
  P.rot=damp(P.rot,clamp(P.vx/MAXV,-1,1)*.34,12,dt);
  const sp=Math.hypot(P.vx,P.vy);
  if(sp>60){P.tt-=dt;if(P.tt<=0){P.tt=.016;emit(P.x-P.vx*.015+rnd(-4,4),P.y-P.vy*.015+rnd(-4,4),rnd(-14,14)-P.vx*.04,rnd(-14,14)-P.vy*.04,.42,rnd(2,5)*Math.min(1,sp/MAXV+.3),0,3)}}
}

/* ================= OBSTACLES + PATTERNS ================= */
const ON=72,obs=Array.from({length:ON},()=>({on:0,x:0,y:0,vx:0,vy:0,s:30,r:0,vr:0,a:0,near:0,h:0,hp:1,f:0,hb:-1,ht:-9}));
// dl = spawn delay in seconds (staggers sequences), h = homing time in seconds
function spawnObs(x,y,vx,vy,s,dl,h){for(let i=0;i<ON;i++){const o=obs[i];if(o.on)continue;o.on=1;o.x=x;o.y=y;o.vx=vx;o.vy=vy;o.s=s;o.r=rnd(0,TAU);o.vr=rnd(-1.8,1.8)*(1+Math.hypot(vx,vy)/600);o.a=-(dl||0);o.near=0;o.h=h||0;o.hp=Math.ceil(s/22);o.f=0;o.hb=-1;o.ht=-9;return}}
const DIR=[[1,0],[-1,0],[0,1],[0,-1]];
const edge=(s,t)=>s<2?[s?AW:0,t*AH]:[t*AW,s===2?0:AH];
const pat={
  single(){const s=rnd(0,4)|0,e=edge(s,rnd(.1,.9)),v=G.speed*rnd(.85,1.2);spawnObs(e[0],e[1],DIR[s][0]*v,DIR[s][1]*v,rnd(20,46))},
  diag(){const l=Math.random()<.5,y=rnd(.1,.9)*AH,v=G.speed*rnd(.9,1.1),dy=(y<AH/2?1:-1)*rnd(.4,.9);spawnObs(l?0:AW,y,(l?1:-1)*v*.8,dy*v,rnd(22,40))},
  aimed(){const s=rnd(0,4)|0,e=edge(s,rnd(.15,.85)),a=Math.atan2(P.y-e[1],P.x-e[0])+rnd(-.1,.1),v=G.speed*1.05;spawnObs(e[0],e[1],Math.cos(a)*v,Math.sin(a)*v,rnd(24,38))},
  pincer(){const h=Math.random()<.5,v=G.speed*.95,o=rnd(-30,30);if(h){spawnObs(0,P.y+o,v,0,34);spawnObs(AW,P.y-o,-v,0,34)}else{spawnObs(P.x+o,0,0,v,34);spawnObs(P.x-o,AH,0,-v,34)}},
  wall(){const h=Math.random()<.5,n=h?8:12,len=h?AH:AW,gap=rnd(1,n-1)|0,v=G.speed*.62,sd=Math.random()<.5;for(let i=0;i<n;i++){if(i===gap)continue;const c=(i+.5)/n*len,s=len/n*.78;if(h)spawnObs(sd?0:AW,c,sd?v:-v,0,s);else spawnObs(c,sd?0:AH,0,sd?v:-v,s)}G.next+=.9}
};
Object.assign(pat,{
  // fan: five cubes spread from one edge point toward the player
  fan(){const s=rnd(0,4)|0,e=edge(s,rnd(.2,.8)),b=Math.atan2(P.y-e[1],P.x-e[0]),v=G.speed*.9;for(let i=-2;i<=2;i++){const a=b+i*.24;spawnObs(e[0],e[1],Math.cos(a)*v,Math.sin(a)*v,24)}},
  // seeker: slow, large cube that steers toward the player for 3s (lighter red while homing)
  seeker(){const n=G.diff>.5?2:1,v=G.speed*.62;for(let i=0;i<n;i++){const s=rnd(0,4)|0,e=edge(s,rnd(.2,.8));spawnObs(e[0],e[1],DIR[s][0]*v,DIR[s][1]*v,36,i*.9,3)}},

/* ================= INPUT ================= */
addEventListener('keydown',e=>{
  if(e.metaKey||e.ctrlKey||e.altKey||/^(Shift|Control|Alt|Meta|Caps)/.test(e.code))return;
  const m=MAP[e.code];if(m){keys[m]=1;if(e.code.startsWith('Arrow')||e.code==='Space')e.preventDefault()}
  if(e.repeat)return;audio();
  if(e.code==='KeyM'){setMute(!muted);sfx.ui();return}
  const s=G.state,pk=e.code==='KeyP'||e.code==='Escape';
  if(s==='play'){if(pk)pause();else if(e.code==='KeyR')start()}
  else if(s==='paused'){if(e.code==='KeyR')start();else resume()}
  else if(s==='menu'||(s==='over'&&G.overT>.6))start();
});
addEventListener('keyup',e=>{const m=MAP[e.code];if(m)keys[m]=0});
addEventListener('pointerup',()=>{keys.f=0});
addEventListener('pointerdown',e=>{
  if(e.target.closest&&e.target.closest('#mute'))return;audio();const s=G.state;
  if(s==='menu'||(s==='over'&&G.overT>.6))start();else if(s==='paused')resume();else if(s==='play')keys.f=1;
});
muteBtn.addEventListener('click',()=>{audio();setMute(!muted);sfx.ui();muteBtn.blur()});
addEventListener('blur',()=>{for(const k in keys)keys[k]=0;pause()});                 // graceful focus loss
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});

/* ================= LOOP ================= */
function frame(now){
  const dt=Math.max(0,Math.min(.05,(now-last)/1000));last=now;
  if(G.state!=='paused')update(dt);
  render();requestAnimationFrame(frame);
}
demoReset();hudUpdate();requestAnimationFrame(frame);
setTimeout(()=>showOv('CUBE','DODGE','PRESS ANY KEY',CTRL),80);
})();
